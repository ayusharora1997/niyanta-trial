name: IndiaMART Scrape

on:
  workflow_dispatch:
    inputs:
      search_id:
        description: Search run ID
        required: true
        type: string
      url:
        description: IndiaMART search URL
        required: true
        type: string
      keyword:
        description: Search keyword
        required: false
        type: string
        default: ''
      search_name:
        description: Human-readable run name
        required: false
        type: string
        default: ''
      max_filter_urls:
        description: Max filter URLs to scrape
        required: false
        type: string
        default: '5'
      combine_depth:
        description: Filter combination depth
        required: false
        type: string
        default: '2'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run pipeline
        working-directory: scraper
        env:
          SEARCH_ID: ${{ inputs.search_id }}
          SEARCH_URL: ${{ inputs.url }}
          SEARCH_KEYWORD: ${{ inputs.keyword }}
          SEARCH_NAME: ${{ inputs.search_name }}
          MAX_FILTER_URLS: ${{ inputs.max_filter_urls }}
          COMBINE_DEPTH: ${{ inputs.combine_depth }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: node pipeline.js
